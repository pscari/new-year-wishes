<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新年祝福</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(to bottom, #0a1931 0%, #1a1a2e 30%, #16213e 70%, #0f3460 100%);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* 星星背景 */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
        }

        /* 弹窗样式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #fff;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-out;
        }

        .modal-text {
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 48px;
            color: #000;
            margin-bottom: 40px;
            text-align: center;
        }

        .receive-btn {
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 24px;
            color: white;
            background-color: #FF0000;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
        }

        .receive-btn:hover,
        .receive-btn:active {
            background-color: #CC0000;
            transform: scale(1.05);
        }

        /* 新年祝福页面 */
        .new-year-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 900;
        }

        .new-year-text {
            text-align: center;
            z-index: 950;
            padding: 20px;
            border-radius: 15px;
            background-color: rgba(0, 0, 0, 0.3);
        }

        .year {
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 120px;
            color: #FFFFFF;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .greeting {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "STXingkai", "Xingkai SC", "KaiTi", "SimKai", cursive;
            font-size: 90px;
            color: #FF0000;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        /* 烟花容器 */
        .fireworks-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 2;
        }

        .firework {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }

        .firework-shell {
            position: absolute;
            width: 6px;
            height: 12px;
            background-color: #FF9900;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
        }

        .ember {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }

        /* 右下角箭头 */
        .next-arrow {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            display: none;
        }

        .next-arrow:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .arrow-icon {
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 20px solid #FF0000;
            margin-left: 5px;
        }

        /* 第二个界面 - 新年祝福场景 */
        .wish-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 1100;
            overflow: hidden;
        }

        /* 地面 */
        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20%;
            background: linear-gradient(to top, #3a2310 0%, #5a3a20 30%, #7a5a30 100%);
            z-index: 3;
        }

        .ground-texture {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                radial-gradient(circle at 30% 50%, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
        }

        /* 孔明灯 */
        .lantern {
            position: absolute;
            pointer-events: none;
            z-index: 2;
        }

        .lantern-body {
            width: 40px;
            height: 60px;
            background-color: rgba(255, 165, 0, 0.9);
            border-radius: 10px;
            position: relative;
            box-shadow:
                inset 0 0 20px rgba(255, 255, 255, 0.5),
                0 0 30px rgba(255, 165, 0, 0.8);
            animation: lanternGlow 3s infinite alternate;
        }

        .lantern-flame {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 15px;
            background: linear-gradient(to top, #FF4500 0%, #FF8C00 50%, #FFD700 100%);
            border-radius: 50% 50% 20% 20%;
            filter: blur(2px);
            animation: flameFlicker 1s infinite alternate;
        }

        /* 灯谜墙 */
        .riddle-wall {
            position: absolute;
            left: 5%;
            top: 20%;
            width: 45%;
            height: 60%;
            background-color: rgba(139, 69, 19, 0.85);
            border-radius: 15px;
            border: 8px solid #8B4513;
            box-shadow:
                inset 0 0 30px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(0, 0, 0, 0.7);
            z-index: 4;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: flex-start;
            overflow: hidden;
        }

        .wall-title {
            width: 100%;
            text-align: center;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 28px;
            color: #FFD700;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
        }

        /* 灯谜牌 */
        .riddle-plaque {
            width: 22%;
            height: 22%;
            margin: 1%;
            background-color: #FFF8DC;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        .riddle-plaque:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .riddle-plaque-top {
            width: 100%;
            height: 10px;
            background-color: #8B0000;
            border-radius: 8px 8px 0 0;
            position: relative;
        }

        .riddle-plaque-hole {
            width: 8px;
            height: 8px;
            background-color: #FFD700;
            border-radius: 50%;
            position: absolute;
            top: 1px;
            left: 50%;
            transform: translateX(-50%);
        }

        .riddle-plaque-string {
            width: 2px;
            height: 12px;
            background-color: #FF0000;
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
        }

        .riddle-plaque-content {
            padding: 8px 5px;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "STXingkai", "Xingkai SC", "KaiTi", "SimKai", cursive;
            font-size: 14px;
            color: #8B0000;
            text-align: center;
            height: calc(100% - 10px);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
        }

        .riddle-plaque-tassel {
            width: 12px;
            height: 20px;
            background: linear-gradient(to bottom, #FF0000 0%, #8B0000 100%);
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 0 0 5px 5px;
        }

        /* 祝福架 */
        .wish-rack {
            position: absolute;
            right: 5%;
            top: 20%;
            width: 25%;
            height: 60%;
            background-color: rgba(139, 69, 19, 0.9);
            border-radius: 15px;
            border: 8px solid #8B4513;
            box-shadow:
                inset 0 0 30px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(0, 0, 0, 0.7);
            z-index: 4;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .rack-title {
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 24px;
            color: #FFD700;
            text-align: center;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
        }

        .rack-structure {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .rack-bar {
            width: 100%;
            height: 12px;
            background: linear-gradient(to right, #8B4513 0%, #A0522D 50%, #8B4513 100%);
            border-radius: 8px;
            position: relative;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.5);
        }

        .rack-bar::before,
        .rack-bar::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #8B4513;
            border-radius: 50%;
            top: -4px;
        }

        .rack-bar::before {
            left: -10px;
        }

        .rack-bar::after {
            right: -10px;
        }

        /* 祝福牌 */
        .wish-plaque {
            position: absolute;
            width: 40px;
            height: 55px;
            background-color: #FFF8DC;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            z-index: 5;
        }

        .wish-plaque:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .plaque-top {
            width: 100%;
            height: 8px;
            background-color: #8B0000;
            border-radius: 6px 6px 0 0;
            position: relative;
        }

        .plaque-hole {
            width: 6px;
            height: 6px;
            background-color: #FFD700;
            border-radius: 50%;
            position: absolute;
            top: 1px;
            left: 50%;
            transform: translateX(-50%);
        }

        .plaque-string {
            width: 2px;
            height: 10px;
            background-color: #FF0000;
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .plaque-content {
            padding: 8px 4px;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "STXingkai", "Xingkai SC", "KaiTi", "SimKai", cursive;
            font-size: 11px;
            color: #8B0000;
            text-align: center;
            height: calc(100% - 8px);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
            opacity: 0;
            /* 初始不显示文字 */
        }

        .plaque-tassel {
            width: 12px;
            height: 20px;
            background: linear-gradient(to bottom, #FF0000 0%, #8B0000 30%, #FF0000 70%, #8B0000 100%);
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 0 0 8px 8px;
        }

        /* 第三个界面 - 祝福牌详情界面 */
        .plaque-detail-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 1200;
            background: linear-gradient(to bottom, #0a1931 0%, #1a1a2e 30%, #16213e 70%, #0f3460 100%);
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .detail-plaque {
            width: 400px;
            height: 500px;
            background-color: #FFF8DC;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.9);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 30px;
            animation: fadeIn 0.8s ease-out;
        }

        .detail-plaque-top {
            width: 100%;
            height: 15px;
            background-color: #8B0000;
            border-radius: 20px 20px 0 0;
            position: relative;
        }

        .detail-plaque-hole {
            width: 12px;
            height: 12px;
            background-color: #FFD700;
            border-radius: 50%;
            position: absolute;
            top: 1px;
            left: 50%;
            transform: translateX(-50%);
        }

        .detail-plaque-string {
            width: 3px;
            height: 20px;
            background-color: #FF0000;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .detail-plaque-content {
            padding: 30px 20px;
            width: 100%;
            text-align: center;
            height: calc(100% - 15px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
        }

        /* 谜语内容样式 */
        .riddle-question {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "STXingkai", "Xingkai SC", "KaiTi", "SimKai", cursive;
            font-size: 32px;
            color: #8B0000;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .riddle-answer {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "STXingkai", "Xingkai SC", "KaiTi", "SimKai", cursive;
            font-size: 28px;
            color: #FF0000;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed #8B0000;
            width: 100%;
        }

        .riddle-explanation {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            font-size: 22px;
            color: #8B0000;
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dotted #8B0000;
            width: 100%;
            line-height: 1.4;
        }

        /* 祝福语内容样式 */
        .blessing-content {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "STXingkai", "Xingkai SC", "KaiTi", "SimKai", cursive;
            font-size: 50px;
            color: #8B0000;
            text-align: center;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .detail-plaque-tassel {
            width: 25px;
            height: 40px;
            background: linear-gradient(to bottom, #FF0000 0%, #8B0000 30%, #FF0000 70%, #8B0000 100%);
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 0 0 15px 15px;
        }

        /* 返回箭头 */
        .back-arrow {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .back-arrow:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .back-icon {
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-right: 20px solid #FF0000;
            margin-right: 5px;
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes lanternGlow {
            0% {
                box-shadow: 0 0 15px rgba(255, 165, 0, 0.8);
            }

            100% {
                box-shadow: 0 0 30px rgba(255, 200, 0, 0.9);
            }
        }

        @keyframes flameFlicker {
            0% {
                transform: translateX(-50%) scale(1);
                opacity: 0.8;
            }

            100% {
                transform: translateX(-50%) scale(1.2);
                opacity: 1;
            }
        }

        /* 移动端完全重新设计布局 - 修正版 */
        @media (max-width: 768px) {

            /* 整体调整 */
            .year {
                font-size: 80px;
            }

            .greeting {
                font-size: 60px;
            }

            /* 第二个界面的完整重设计 */
            .wish-scene {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                overflow-x: hidden;
                overflow-y: auto;
                /* 允许垂直滚动 */
            }

            /* 地面保持原样 */
            .ground {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 20%;
                z-index: 3;
            }

            /* 主要内容容器使用flex布局实现并排 */
            .main-content {
                position: relative;
                top: 10vh;
                left: 0;
                width: 100%;
                min-height: 65vh;
                display: flex;
                flex-direction: row;
                justify-content: space-around;
                align-items: flex-start;
                padding: 0 2.5%;
                box-sizing: border-box;
                z-index: 4;
            }

            /* 手机端：将两个容器改为水平并排 - 修正版 */
            .riddle-wall,
            .wish-rack {
                position: relative !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                width: 46% !important;
                height: 65vh !important;
                /* 高度固定 */
                margin: 0 !important;
                display: block !important;
                /* 使用block而不是inline-block */
                overflow: hidden !important;
                z-index: 4;
                float: none !important;
                /* 移除float */
                box-sizing: border-box !important;
            }

            /* 左侧：猜灯谜 */
            .riddle-wall {
                margin-right: 2% !important;
            }

            /* 右侧：祈福架 */
            .wish-rack {
                margin-left: 2% !important;
            }

            /* 调整标题 */
            .wall-title,
            .rack-title {
                font-size: 20px;
                margin-bottom: 10px;
            }

            /* 灯谜牌调整 */
            .riddle-plaque {
                width: 45%;
                height: 20%;
                margin: 2.5%;
                min-height: 70px;
            }

            .riddle-plaque-content {
                font-size: 12px;
                line-height: 1.2;
                padding: 5px 3px;
            }

            /* 祈福架内部布局 - 保持并排显示 */
            .rack-structure {
                display: none !important;
                /* 隐藏横杆 */
            }

            #plaquesContainer {
                display: grid !important;
                grid-template-columns: repeat(2, 1fr) !important;
                /* 每行两个 */
                grid-auto-rows: minmax(70px, auto) !important;
                /* 自动行高 */
                gap: 8px !important;
                height: calc(100% - 40px) !important;
                width: 100% !important;
                padding: 5px !important;
                overflow-y: auto !important;
                position: relative !important;
                box-sizing: border-box !important;
                -webkit-overflow-scrolling: touch !important;
                /* iOS平滑滚动 */
            }

            /* 祝福牌调整 */
            .wish-plaque {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                transform: none !important;
                width: 100% !important;
                height: 70px !important;
                margin: 0 !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
                box-sizing: border-box !important;
            }

            /* 祝福牌文字 - 悬停时才显示 */
            .plaque-content {
                opacity: 0 !important;
                /* 初始不显示 */
                font-size: 11px !important;
                padding: 5px 2px !important;
                transition: opacity 0.3s !important;
            }

            /* 悬停时显示文字 */
            .wish-plaque:hover .plaque-content {
                opacity: 1 !important;
            }

            /* 触摸设备：点击时显示文字 */
            .wish-plaque.touched .plaque-content {
                opacity: 1 !important;
            }

            /* 详情页调整 */
            .detail-plaque {
                width: 320px;
                height: 420px;
            }

            .riddle-question {
                font-size: 24px;
            }

            .riddle-answer {
                font-size: 22px;
            }

            .riddle-explanation {
                font-size: 18px;
            }

            .scene-header {

                text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);

        }

        /* 小屏幕手机调整 */
        @media (max-width: 480px) {
            .modal-text {
                font-size: 40px;
            }

            .year {
                font-size: 60px;
            }

            .greeting {
                font-size: 45px;
            }

            /* 进一步调整容器宽度 */
            .main-content {
                top: 8vh;
                padding: 0 1%;
            }

            .riddle-wall,
            .wish-rack {
                width: 48% !important;
                height: 60vh !important;
                margin: 0 1% !important;
            }

            .wall-title,
            .rack-title {
                font-size: 18px;
            }

            /* 灯谜牌调整 */

                width: 44%;

                margin: 3%;
            }

            .riddle-plaque-content {

            /* 祝福牌调整 */

                height: 60px !important;
            }

            .plaque-content {
                font-size: 9px !important;
                padding: 4px 1px !important;
            }

            /* 网格调整为更适合小屏幕 */
            #plaquesContainer {

                font-size: 16px;
            }

                font-size: 28px;
            }
        }

        /* 针对iOS优化 */
        @supports (-webkit-touch-callout: none) {

            .greeting,
            .riddle-plaque-content,
            .plaque-content,
            .riddle-question,
            .riddle-answer,
            .riddle-explanation,
            .blessing-content {

            }

            /* iOS滚动优化 */
            .wish-scene {

            }
        }

        /* 添加固定标题到HTML结构中 */
        .scene-header {
            display: none;

    <script>

            // 灯谜数组 - 包含谜面、谜底和解析
            const riddles = [

                {

                    explanation: "解析：“春”字节省掉“三人”，剩下“日”；“聚”字的首部为“取”。"
                },
                {
                    riddle: "春节后消费居第一 （打一成语）",
                    answer: "年过花甲",
                    explanation: "解析：“花”，别解为“花销、消费”。春节后消费居第一位，所以是年过花甲。"
                },
                {
                    riddle: "小小个，橙黄皮，春节买，图吉利。（打一水果）",
                    answer: "金桔",
                    explanation: "解析：金桔又称金枣、金柑，新春佳节出口香港很受欢迎，象征大吉大利。"
                },
                {
                    riddle: "春节一天作灯谜 （打一成语）",
                    answer: "三人成虎",
                    explanation: "解析：“春”字节省掉一“天（日）”，余下“三人”；“灯谜”，又称“文虎”。"
                },
                {
                    riddle: "春节前营运特点 （打一成语）",

                    explanation: "解析：“反”旧时同“返”。春节前人们返回家乡，客人变为主人。"
                },

                    riddle: "春节之日有谜会 （打一成语）",

                },
                {
                    riddle: "春节三日西北游 （打一字）",
                    answer: "仑",
                    explanation: "解析：“春”字节省去“三日”，余下“人”；“北”字的西半部游走了，余下“匕”；合成“化”或“仑”字。"
                },
                {
                    riddle: "春节三日去游山 （打一字）",
                    answer: "仙",
                    explanation: "解析：“春”字可分解为“三人日”，“春”字节省掉“三日”之后余下“人”；“人”游“山”即“仙”字。"
                },
                {
                    riddle: "天天过春节 （打一成语）",
                    answer: "度日如年",
                    explanation: "解析：日日都是年，形容日子过得慢或天天像过年一样。"
                },
                {
                    riddle: "春节离家除夕回 （打一成语）",
                    answer: "满载而归",
                    explanation: "解析：谜底别解为“满一年才回来”。从春节离开到除夕回来正好一年。"
                },
                {
                    riddle: "春节三日多云 （打一字）",
                    answer: "会",
                    explanation: "解析：“春”字节省掉“三日”，余下“人”，多了“云”之后，可成“会”字。"
                },
                {
                    riddle: "东坡阁第酬除夕 （打一外国地名）",
                    answer: "苏门答腊",
                    explanation: "解析：东坡指苏轼，扣“苏”；阁第指门第，扣“门”；酬指答谢；除夕指腊月。"
                },
                {
                    riddle: "除夕守岁数钟声。（打一商业用语）",
                    answer: "年终盘点",
                    explanation: "解析：除夕守岁是年终活动，数钟声是盘点时间，所以是年终盘点。"
                },
                {
                    riddle: "除夕一梦正月到 （打二字美国历史人名）",
                    answer: "林肯",
                    explanation: "解析：除夕是年末，梦到正月即新年开始，“林”指树林，“肯”表示同意，这里取谐音。"
                },
                {
                    riddle: "铭记除夕应归根 （打一树名）",

                    explanation: "解析：除夕是年终，铭记即印在心上，“银”谐音“印”，“杏”谐音“心”。"

            // 祝福语数组

                "阖家幸福，团团圆圆",
                "事业顺利，步步高升",
                "吉祥如意，福星高照",
                "快乐安康，幸福绵长",
                "年年有余，岁岁平安",
                "福禄双全，喜气洋洋",
                "前程似锦，一帆风顺",
                "好运常伴，快乐永随",
                "幸福美满，其乐融融",
                "金玉满堂，花开富贵",
                "春风得意，马到成功",
                "心想事成，美梦成真",
                "五福临门，六六大顺",
                "福如东海，寿比南山",
                "阖家欢乐，幸福安康"
            ];

            // 创建星空背景
            createStars();

            // 设置年份和祝福语
            const currentYear = new Date().getFullYear();
            yearText.textContent = (currentYear + 1).toString();
            greetingText.textContent = "新年快乐！！！";

            // 点击"收到"按钮
            receiveBtn.addEventListener('click', function () {
                // 淡出弹窗
                messageModal.style.animation = 'fadeOut 0.5s forwards';

                // 延迟显示新年祝福页面
                setTimeout(function () {
                    messageModal.style.display = 'none';
                    newYearContainer.style.display = 'flex';

                    // 开始烟花表演
                    startFireworkShow();

                    // 显示右下角箭头
                    setTimeout(() => {
                        nextArrow.style.display = 'flex';
                    }, 1500);
                }, 500);
            });

            // 点击右下角箭头进入第二个界面
            nextArrow.addEventListener('click', function () {
                // 淡出第一个界面
                newYearContainer.style.animation = 'fadeOut 0.8s forwards';

                setTimeout(() => {
                    newYearContainer.style.display = 'none';
                    // 显示第二个界面
                    wishScene.style.display = 'block';

                    // 移动端显示固定标题
                    if (isMobile()) {
                        sceneHeader.style.display = 'flex';
                    }

                    // 创建孔明灯
                    createLanterns();

                    // 创建灯谜牌
                    createRiddlePlaques();

                    // 创建祝福牌
                    createWishPlaques();

                    // 移动端适配
                    adjustForMobile();
                }, 800);
            });

            // 点击返回箭头返回祝福场景
            backArrow.addEventListener('click', function () {
                // 淡出第三个界面
                plaqueDetailContainer.style.animation = 'fadeOut 0.8s forwards';

                setTimeout(() => {
                    plaqueDetailContainer.style.display = 'none';
                    // 显示第二个界面
                    wishScene.style.display = 'block';
                    wishScene.style.animation = 'fadeIn 0.8s forwards';

                    // 移动端显示固定标题
                    if (isMobile()) {
                        sceneHeader.style.display = 'flex';
                    }
                }, 800);
            });

            // 创建星空背景
            function createStars() {
                const starCount = 150;

                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    star.classList.add('star');

                    // 随机大小（1-3像素）
                    const size = Math.random() * 2 + 1;
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';

                    // 随机位置
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';

                    // 随机闪烁动画
                    const duration = Math.random() * 3 + 2;
                    const delay = Math.random() * 5;
                    star.style.animation = `twinkle ${duration}s infinite ${delay}s`;

                    // 随机透明度
                    star.style.opacity = Math.random() * 0.5 + 0.3;

                    starsContainer.appendChild(star);
                }
            }

            // 开始烟花表演
            function startFireworkShow() {
                fireworksContainer.innerHTML = '';

                const launchInterval = setInterval(() => {
                    const batchCount = 5 + Math.floor(Math.random() * 2);
                    for (let i = 0; i < batchCount; i++) {
                        setTimeout(() => {
                            launchFirework();
                        }, i * 100);
                    }
                }, 800);

                setTimeout(() => {
                    clearInterval(launchInterval);
                }, 5 * 60 * 1000);
            }

            // 发射单个烟花
            function launchFirework() {
                const fireworkTypes = ['standard', 'ring', 'heart', 'star', 'spiral'];
                const fireworkType = fireworkTypes[Math.floor(Math.random() * fireworkTypes.length)];

                const launchX = Math.random() * 80 + 10;
                const explosionY = Math.random() * 41 + 25;

                const shell = document.createElement('div');
                shell.classList.add('firework-shell');

                const shellColors = ['#FF9900', '#FF6600', '#FF3300', '#FFFF00'];
                shell.style.backgroundColor = shellColors[Math.floor(Math.random() * shellColors.length)];

                shell.style.left = launchX + '%';
                shell.style.bottom = '0px';
                shell.style.opacity = '1';

                fireworksContainer.appendChild(shell);

                const flightDistance = explosionY;
                const flightDuration = flightDistance * 3 + 150;

                const shellAnimation = shell.animate([
                    {
                        transform: 'translateY(0) scale(1)',
                        opacity: 1
                    },
                    {
                        transform: `translateY(-${explosionY}vh) scale(0.8)`,
                        opacity: 1
                    }
                ], {
                    duration: flightDuration,
                    easing: 'cubic-bezier(0.1, 0.9, 0.2, 1)'
                });

                shellAnimation.onfinish = () => {
                    shell.remove();
                    createExplosion(launchX, explosionY, fireworkType);
                };
            }

            // 创建爆炸效果
            function createExplosion(explosionX, explosionY, fireworkType) {
                let particleCount, explosionRadius;

                switch (fireworkType) {
                    case 'ring':
                        particleCount = 150;
                        explosionRadius = 40;
                        createRingExplosion(explosionX, explosionY, explosionRadius, particleCount);
                        break;
                    case 'heart':
                        particleCount = 180;
                        explosionRadius = 45;
                        createHeartExplosion(explosionX, explosionY, explosionRadius, particleCount);
                        break;
                    case 'star':
                        particleCount = 200;
                        explosionRadius = 50;
                        createStarExplosion(explosionX, explosionY, explosionRadius, particleCount);
                        break;
                    case 'spiral':
                        particleCount = 160;
                        explosionRadius = 40;
                        createSpiralExplosion(explosionX, explosionY, explosionRadius, particleCount);
                        break;
                    default:
                        particleCount = 120;
                        explosionRadius = 45;
                        createStandardExplosion(explosionX, explosionY, explosionRadius, particleCount);
                }
            }

            // 创建标准爆炸效果
            function createStandardExplosion(centerX, centerY, radius, particleCount) {
                const colors = ['#FF0000', '#FF6600', '#FFFF00', '#00FF00', '#00FFFF', '#0000FF', '#FF00FF'];

                createExplosionCenter(centerX, centerY, colors[0]);

                for (let i = 0; i < particleCount; i++) {
                    createExplosionParticle(centerX, centerY, colors, radius, 'standard', i, particleCount);
                }
            }

            // 创建环形爆炸效果
            function createRingExplosion(centerX, centerY, radius, particleCount) {
                const colors = ['#00FFFF', '#00FF00', '#FFFF00', '#FF9900', '#FF0000'];

                createExplosionCenter(centerX, centerY, colors[0]);

                for (let ring = 0; ring < 3; ring++) {
                    const ringRadius = radius * (0.4 + ring * 0.3);
                    const ringParticleCount = Math.floor(particleCount / 3);

                    for (let i = 0; i < ringParticleCount; i++) {
                        setTimeout(() => {
                            createExplosionParticle(centerX, centerY, colors, ringRadius, 'ring', i, ringParticleCount);
                        }, ring * 50);
                    }
                }
            }

            // 创建心形爆炸效果
            function createHeartExplosion(centerX, centerY, radius, particleCount) {
                const colors = ['#FF0066', '#FF3366', '#FF6699', '#FF0033'];

                createExplosionCenter(centerX, centerY, colors[0]);

                for (let i = 0; i < particleCount; i++) {
                    createExplosionParticle(centerX, centerY, colors, radius, 'heart', i, particleCount);
                }
            }

            // 创建星形爆炸效果
            function createStarExplosion(centerX, centerY, radius, particleCount) {
                const colors = ['#FFFF00', '#FF9900', '#FF6600', '#FF0000'];

                createExplosionCenter(centerX, centerY, colors[0]);

                for (let i = 0; i < particleCount; i++) {
                    createExplosionParticle(centerX, centerY, colors, radius, 'star', i, particleCount);
                }
            }

            // 创建螺旋爆炸效果
            function createSpiralExplosion(centerX, centerY, radius, particleCount) {
                const colors = ['#00FFFF', '#00FF00', '#FFFF00', '#FF9900'];

                createExplosionCenter(centerX, centerY, colors[0]);

                for (let i = 0; i < particleCount; i++) {
                    createExplosionParticle(centerX, centerY, colors, radius, 'spiral', i, particleCount);
                }
            }

            // 创建爆炸中心亮点
            function createExplosionCenter(centerX, centerY, color) {
                const centerGlow = document.createElement('div');
                centerGlow.classList.add('firework');
                centerGlow.style.width = '20px';
                centerGlow.style.height = '20px';
                centerGlow.style.backgroundColor = color;
                centerGlow.style.left = centerX + '%';
                centerGlow.style.top = centerY + '%';
                centerGlow.style.opacity = '1';
                centerGlow.style.boxShadow = `0 0 30px 15px ${color}`;
                centerGlow.style.zIndex = '5';

                fireworksContainer.appendChild(centerGlow);

                centerGlow.animate([
                    { transform: 'scale(1)', opacity: 1 },
                    { transform: 'scale(3)', opacity: 0 }
                ], {
                    duration: 150,
                    easing: 'ease-out'
                });

                setTimeout(() => {
                    centerGlow.remove();
                }, 150);
            }

            // 创建爆炸粒子
            function createExplosionParticle(centerX, centerY, colors, radius, pattern, index, total) {
                const particle = document.createElement('div');
                particle.classList.add('firework');

                const color = colors[Math.floor(Math.random() * colors.length)];
                particle.style.backgroundColor = color;

                const size = Math.random() * 8 + 3;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';

                particle.style.left = centerX + '%';
                particle.style.top = centerY + '%';

                particle.style.boxShadow = `0 0 ${size * 2}px ${color}`;

                fireworksContainer.appendChild(particle);

                let tx, ty;

                switch (pattern) {
                    case 'ring':
                        const angle = (index / total) * Math.PI * 2;
                        const distance = radius;
                        tx = Math.cos(angle) * distance;
                        ty = Math.sin(angle) * distance;
                        break;

                    case 'heart':
                        const t = index / total * Math.PI * 2;
                        const heartX = 16 * Math.pow(Math.sin(t), 3);
                        const heartY = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                        tx = heartX * 1.5;
                        ty = heartY * 1.5;
                        break;

                    case 'star':
                        const starAngle = (index / total) * Math.PI * 2;
                        const starPoints = 5;
                        const starRadius = radius * (0.5 + 0.5 * Math.sin(starPoints * starAngle));
                        tx = Math.cos(starAngle) * starRadius;
                        ty = Math.sin(starAngle) * starRadius;
                        break;

                    case 'spiral':
                        const spiralAngle = index / total * Math.PI * 10;
                        const spiralRadius = index / total * radius;
                        tx = Math.cos(spiralAngle) * spiralRadius;
                        ty = Math.sin(spiralAngle) * spiralRadius;
                        break;

                    default:
                        const randomAngle = Math.random() * Math.PI * 2;
                        const randomDistance = Math.random() * radius + 5;
                        tx = Math.cos(randomAngle) * randomDistance;
                        ty = Math.sin(randomAngle) * randomDistance * 0.8 + randomDistance * 0.2;
                }

                const duration = Math.random() * 500 + 300;

                particle.animate([
                    {
                        transform: 'translate(0, 0) scale(1)',
                        opacity: 1
                    },
                    {
                        transform: `translate(${tx}vw, ${ty}vh) scale(0.2)`,
                        opacity: 0
                    }
                ], {
                    duration: duration,
                    easing: 'cubic-bezier(0.1, 0.9, 0.2, 1)'
                });

                setTimeout(() => {
                    if (particle.parentNode) {
                        particle.remove();
                    }
                }, duration + 100);
            }

            // 创建孔明灯
            function createLanterns() {
                lanternsContainer.innerHTML = '';

                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        createLantern();
                    }, i * 2000);
                }

                const lanternInterval = setInterval(() => {
                    createLantern();
                }, 6000);

                setTimeout(() => {
                    clearInterval(lanternInterval);
                }, 10 * 60 * 1000);
            }

            function createLantern() {
                const lantern = document.createElement('div');
                lantern.classList.add('lantern');

                const left = Math.random() * 80 + 10;
                lantern.style.left = left + '%';

                lantern.style.bottom = '20%';

                const scale = Math.random() * 0.4 + 0.6;
                lantern.style.transform = `scale(${scale})`;

                const lanternBody = document.createElement('div');
                lanternBody.classList.add('lantern-body');

                const lanternFlame = document.createElement('div');
                lanternFlame.classList.add('lantern-flame');

                lanternBody.appendChild(lanternFlame);
                lantern.appendChild(lanternBody);

                lanternsContainer.appendChild(lantern);

                const duration = 20000 + Math.random() * 10000;
                lantern.animate([
                    {
                        transform: `translateY(0) scale(${scale}) rotate(0deg)`,
                        opacity: 0.9
                    },
                    {
                        transform: `translateY(-120vh) scale(${scale}) rotate(${Math.random() * 10 - 5}deg)`,
                        opacity: 0.9
                    }
                ], {
                    duration: duration,
                    easing: 'linear'
                });

                setTimeout(() => {
                    if (lantern.parentNode) {
                        lantern.remove();
                    }
                }, duration);
            }

            // 创建灯谜牌
            function createRiddlePlaques() {
                riddleWall.innerHTML = '<div class="wall-title">猜灯谜</div>';

                const shuffledRiddles = [...riddles].sort(() => Math.random() - 0.5);

                for (let i = 0; i < 16; i++) {
                    const riddleObj = shuffledRiddles[i % shuffledRiddles.length];
                    const riddle = riddleObj.riddle;
                    const answer = riddleObj.answer;
                    const explanation = riddleObj.explanation;

                    const plaque = document.createElement('div');
                    plaque.classList.add('riddle-plaque');
                    plaque.dataset.riddle = riddle;
                    plaque.dataset.answer = answer;
                    plaque.dataset.explanation = explanation;

                    const plaqueTop = document.createElement('div');
                    plaqueTop.classList.add('riddle-plaque-top');

                    const plaqueHole = document.createElement('div');
                    plaqueHole.classList.add('riddle-plaque-hole');

                    const plaqueString = document.createElement('div');
                    plaqueString.classList.add('riddle-plaque-string');

                    const plaqueContent = document.createElement('div');
                    plaqueContent.classList.add('riddle-plaque-content');
                    plaqueContent.textContent = riddle;

                    const plaqueTassel = document.createElement('div');
                    plaqueTassel.classList.add('riddle-plaque-tassel');

                    plaqueTop.appendChild(plaqueHole);
                    plaqueTop.appendChild(plaqueString);
                    plaque.appendChild(plaqueTop);
                    plaque.appendChild(plaqueContent);
                    plaque.appendChild(plaqueTassel);

                    plaque.addEventListener('click', function () {
                        handleRiddleClick(riddle, answer, explanation);
                    });

                    riddleWall.appendChild(plaque);
                }
            }

            // 处理灯谜牌点击
            function handleRiddleClick(riddle, answer, explanation) {
                detailPlaqueContent.innerHTML = `
                    <div class="riddle-question">${riddle}</div>
                    <div class="riddle-answer">答案：${answer}</div>
                    <div class="riddle-explanation">${explanation}</div>
                `;

                wishScene.style.animation = 'fadeOut 0.8s forwards';

                setTimeout(() => {
                    wishScene.style.display = 'none';
                    sceneHeader.style.display = 'none';
                    plaqueDetailContainer.style.display = 'flex';
                    plaqueDetailContainer.style.animation = 'fadeIn 0.8s forwards';
                }, 800);
            }

            // 创建祝福牌
            function createWishPlaques() {
                plaquesContainer.innerHTML = '';

                const shuffledBlessings = [...blessings].sort(() => Math.random() - 0.5);

                // 在移动端使用网格布局
                const isMobileDevice = isMobile();

                if (isMobileDevice) {
                    // 移动端：使用网格布局
                    for (let i = 0; i < 20; i++) {
                        const blessing = shuffledBlessings[i] || "新年快乐，万事如意";

                        const plaque = document.createElement('div');
                        plaque.classList.add('wish-plaque');
                        plaque.dataset.blessing = blessing;

                        // 移动端：添加触摸事件
                        plaque.addEventListener('touchstart', function () {
                            this.classList.add('touched');
                            setTimeout(() => {
                                this.classList.remove('touched');
                            }, 1000);
                        });

                        // 移动端：添加点击事件（兼容性）
                        plaque.addEventListener('click', function () {
                            handleWishPlaqueClick(blessing);
                        });

                        const plaqueTop = document.createElement('div');
                        plaqueTop.classList.add('plaque-top');

                        const plaqueHole = document.createElement('div');
                        plaqueHole.classList.add('plaque-hole');

                        const plaqueString = document.createElement('div');
                        plaqueString.classList.add('plaque-string');

                        const plaqueContent = document.createElement('div');
                        plaqueContent.classList.add('plaque-content');
                        plaqueContent.textContent = blessing;

                        const plaqueTassel = document.createElement('div');
                        plaqueTassel.classList.add('plaque-tassel');

                        plaqueTop.appendChild(plaqueHole);
                        plaqueTop.appendChild(plaqueString);
                        plaque.appendChild(plaqueTop);
                        plaque.appendChild(plaqueContent);
                        plaque.appendChild(plaqueTassel);

                        plaquesContainer.appendChild(plaque);
                    }
                } else {
                    // 桌面端：使用原有布局
                    const positions = [];
                    const barTop = [15, 40, 65, 90];

                    for (let row = 0; row < 4; row++) {
                        for (let col = 0; col < 5; col++) {
                            positions.push({
                                top: `${barTop[row]}%`,
                                left: `${10 + col * 20}%`
                            });
                        }
                    }

                    for (let i = 0; i < 20; i++) {
                        const blessing = shuffledBlessings[i] || "新年快乐，万事如意";

                        const plaque = document.createElement('div');
                        plaque.classList.add('wish-plaque');
                        plaque.dataset.blessing = blessing;

                        plaque.style.top = positions[i].top;
                        plaque.style.left = positions[i].left;
                        plaque.style.transform = 'translate(-50%, -50%)';

                        plaque.addEventListener('mouseenter', function () {
                            this.querySelector('.plaque-content').style.opacity = '1';
                        });

                        plaque.addEventListener('mouseleave', function () {
                            this.querySelector('.plaque-content').style.opacity = '0';
                        });

                        plaque.addEventListener('click', function () {
                            handleWishPlaqueClick(blessing);
                        });

                        const plaqueTop = document.createElement('div');
                        plaqueTop.classList.add('plaque-top');

                        const plaqueHole = document.createElement('div');
                        plaqueHole.classList.add('plaque-hole');

                        const plaqueString = document.createElement('div');
                        plaqueString.classList.add('plaque-string');

                        const plaqueContent = document.createElement('div');
                        plaqueContent.classList.add('plaque-content');
                        plaqueContent.textContent = blessing;
                        plaqueContent.style.opacity = '0';

                        const plaqueTassel = document.createElement('div');
                        plaqueTassel.classList.add('plaque-tassel');

                        plaqueTop.appendChild(plaqueHole);
                        plaqueTop.appendChild(plaqueString);
                        plaque.appendChild(plaqueTop);
                        plaque.appendChild(plaqueContent);
                        plaque.appendChild(plaqueTassel);

                        plaquesContainer.appendChild(plaque);
                    }
                }
            }

            // 处理祝福牌点击
            function handleWishPlaqueClick(blessing) {
                detailPlaqueContent.innerHTML = `<div class="blessing-content">${blessing}</div>`;

                wishScene.style.animation = 'fadeOut 0.8s forwards';

                setTimeout(() => {
                    wishScene.style.display = 'none';
                    sceneHeader.style.display = 'none';
                    plaqueDetailContainer.style.display = 'flex';
                    plaqueDetailContainer.style.animation = 'fadeIn 0.8s forwards';
                }, 800);
            }

            // 检测是否为移动设备
            function isMobile() {
                return window.innerWidth <= 768;
            }

            // 移动端适配
            function adjustForMobile() {
                if (isMobile()) {
                    // 设置灯谜墙和祈福架为并排
                    const riddleWallEl = document.querySelector('.riddle-wall');
                    const wishRackEl = document.querySelector('.wish-rack');

                    if (riddleWallEl && wishRackEl) {
                        // 确保它们在移动端是并排的
                        riddleWallEl.style.cssText = `
                            position: relative !important;
                            display: inline-block !important;
                            width: 45% !important;
                            height: 60vh !important;
                            margin-left: 2.5% !important;
                            margin-right: 2.5% !important;
                            float: left !important;
                            top: 10vh !important;
                            overflow-y: auto !important;
                        `;

                        wishRackEl.style.cssText = `
                            position: relative !important;
                            display: inline-block !important;
                            width: 45% !important;
                            height: 60vh !important;
                            margin-left: 2.5% !important;
                            margin-right: 2.5% !important;
                            float: left !important;
                            top: 10vh !important;
                            overflow-y: auto !important;
                        `;

                        // 确保底部挨着地面
                        const groundTop = window.innerHeight * 0.8;
                        const containerHeight = window.innerHeight * 0.6;
                        const containerTop = groundTop - containerHeight - 10;

                        riddleWallEl.style.top = `${containerTop}px !important`;
                        wishRackEl.style.top = `${containerTop}px !important`;

                        // 设置内部滚动
                        riddleWallEl.style.overflowY = 'auto';
                        wishRackEl.style.overflowY = 'auto';
                        riddleWallEl.style.webkitOverflowScrolling = 'touch';
                        wishRackEl.style.webkitOverflowScrolling = 'touch';
                    }

                    // 设置固定标题
                    sceneHeader.style.cssText = `
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 10vh;
                        background: rgba(10, 25, 49, 0.95);
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        z-index: 10;
                        border-bottom: 2px solid #FFD700;
                    `;
                }
            }

            // 窗口大小改变时重新适配
            window.addEventListener('resize', adjustForMobile);

            // 简单的安全防护
            document.addEventListener('contextmenu', function (e) {
                e.preventDefault();
                return false;
            });
        });
    </script>
</body>
